; ============================================================
; ENV 1: Builds the custom bootloader (reset-reason routing)
; Run ONCE: pio run -e bootloader
; ============================================================
[env:bootloader]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf
board_build.partitions = partitions.csv
build_flags =
    -DESP32S3

; ============================================================
; ENV 2: Builds the launcher app (Arduino + M5Cardputer)
; Build:  pio run -e m5cardputer
; Flash:  upload_factory.bat COMx
; ============================================================
[env:m5cardputer]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions.csv
lib_deps =
    https://github.com/m5stack/M5Cardputer.git
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM=0
monitor_speed = 115200
upload_speed = 1500000
